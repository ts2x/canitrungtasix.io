const $=id=>document.getElementById(id);
function fillGrouped(id,raw,def){const s=$(id);let g;raw.split("\n").forEach(l=>{if(l[0]==="#"){g=document.createElement("optgroup");g.label=l.slice(1);s.appendChild(g)}else{const o=document.createElement("option");const p=l.split("|");o.textContent=p[0];o.value=l;(g||s).appendChild(o)}});if(def)[...s.options].forEach(o=>{if(o.textContent===def)o.selected=true})}
function fill(id,raw,di){const s=$(id);raw.split("\n").forEach((l,i)=>{const o=document.createElement("option");o.textContent=l.split("|")[0];o.value=l;if(i===di)o.selected=true;s.appendChild(o)})}

fill("ram",RAM,5);fill("rtype",RT,3);fill("sto",STO,3);fill("free",FREE,2);fill("os",OS,1);fill("psu",PSU,5);fill("res",RES,1);fill("tgt",TGT,1);
const PRE=[{n:"Low",g:1.7,c:1.15,v:-2},{n:"Medium",g:1.3,c:1.08,v:-1},{n:"High",g:1,c:1,v:0},{n:"Ultra",g:.72,c:.95,v:2}];
const val=id=>$(id).value.split("|");
function calc(p,S){
 const rt=S.rt?.6:1, up=S.up?1.4:1;
 const gf=S.g*.7*p.g*S.rm*up*rt;
 const cf=S.c*.9*p.c*(S.rt?.85:1);
 let need=S.rv+p.v-(S.up?1:0)+(S.rt?1.5:0);need=Math.max(3,need);
 const vf=S.vram>=need?1:Math.pow(Math.max(.3,S.vram/need),1.5);
 const fps=Math.pow(Math.pow(gf,-4)+Math.pow(cf,-4),-.25)*vf*S.rf*S.sf;
 return{fps,gf,cf,need,vf,low:fps*S.lf*(S.ram<16?.8:1)};
}
function col(f,t){return f>=t?"var(--good)":f>=30?"var(--warn)":"var(--bad)"}
$("scan").onclick=()=>{
 const out=$("out");out.innerHTML='<h2>Results</h2><p class="scanning">Scanning your build…</p>';

function render(){
 const g=val("gpu"),c=val("cpu"),ram=+val("ram")[1],rt=val("rtype"),st=val("sto"),fr=+val("free")[1],os=+val("os")[1],psu=+val("psu")[1],rs=val("res"),tg=+val("tgt")[1];
 const gname=g[0],cname=c[0];
 const rf=ram>=32?1.02:ram>=16?1:ram>=12?.85:ram>=8?.6:.4;
 const S={g:+g[1],vram:+g[2],c:+c[1],ram,rf,sf:+rt[1],lf:+st[1],rm:+rs[1],rv:+rs[2],up:$("up").checked,rt:$("rt").checked};
 const rows=PRE.map(p=>({p,...calc(p,S)}));
 const best=[...rows].reverse().find(r=>r.fps>=tg);
 const low=rows[0],mid=rows[1];
 let cls,head,sub,score;
 const dead=os===0||os===3||fr===0||S.g<8;
 if(os===0){cls="var(--bad)";head="No. Your OS is too old.";sub="GTA VI will need a modern 64-bit Windows with DirectX 12. Windows 7 and 8.1 can’t run it."}
 else if(fr===0){cls="var(--bad)";head="No. Not enough disk space.";sub="Free up space first. Plan for 150 GB or more on an SSD."}
 else if(low.fps<24){cls="var(--bad)";head="No, it won’t run well.";sub=`Even on Low you’d get about ${Math.round(low.fps)} FPS at this resolution. A GPU upgrade is the first fix.`}
 else if(low.fps<30){cls="var(--bad)";head="Barely, and it won’t feel good.";sub=`Expect around ${Math.round(low.fps)} FPS on Low with dips below that.`}
 else if(!best){cls="var(--warn)";head=mid.fps>=30?"Yes, but below your FPS target.":"Yes, on Low settings.";sub=`Best you can do is about ${Math.round(PRE.map((p,i)=>rows[i]).filter(r=>r.fps>=30).slice(-1)[0].fps)} FPS on ${rows.filter(r=>r.fps>=30).slice(-1)[0].p.n}.`}
 else if(best.p.n==="Ultra"){cls="var(--good)";head="Yes. Ultra, no problem.";sub=`About ${Math.round(best.fps)} FPS average at ${rs[0].split(" (")[0]}.`}
 else{cls="var(--good)";head=`Yes. Run it on ${best.p.n}.`;sub=`About ${Math.round(best.fps)} FPS average at ${rs[0].split(" (")[0]}, enough for your ${tg} FPS target.`}
 score=Math.max(0,Math.min(100,Math.round(mid.fps/(tg*1.2)*100)));
 if(dead&&os!==0&&fr!==0&&S.g<8)score=Math.min(score,5);
 const top=best||rows.filter(r=>r.fps>=30).slice(-1)[0]||low;
 let h=`<h2>Results</h2><div class="verdict" style="--c:${cls}"><b>${head}</b><span>${sub}</span><div class="meter" role="img" aria-label="Readiness ${score} out of 100"><i style="width:${score}%"></i></div><small style="color:var(--muted)">Readiness score: ${score}/100 on ${gname} + ${cname}</small></div>`;
 h+=`<table><tr><th>Preset</th><th>Avg FPS</th><th>1% low</th><th style="width:30%"></th></tr>`;
 rows.forEach(r=>{const a=Math.round(r.fps),cc=col(r.fps,tg);h+=`<tr><td>${r.p.n}</td><td style="color:${cc};font-weight:800">${a}</td><td>${Math.round(r.low)}</td><td><div class="bar" style="--c:${cc};background:${cc};width:${Math.min(100,a/Math.max(tg*1.3,60)*100)}%"></div></td></tr>`});
 h+=`</table><ul>`;
 const L=(k,t)=>h+=`<li class="${k}" data-i="${k==="g"?"✔":k==="w"?"!":"✖"}">${t}</li>`;
 // GPU/CPU bottleneck
 const t0=rows[2];
 if(t0.cf<t0.gf*.8)L("w",`<b>CPU bottleneck.</b> ${cname} caps you near ${Math.round(t0.cf)} FPS, so a faster GPU won’t help much. Lower crowd and traffic density, or upgrade the CPU.`);
 else if(t0.gf<t0.cf*.8)L("w",`<b>GPU bottleneck.</b> ${gname} limits your frame rate. Lowering resolution or turning on upscaling gives the biggest gains.`);
 else L("g","<b>Balanced build.</b> Your CPU and GPU are well matched.");
 // VRAM
 const nd=Math.round(t0.need*10)/10;
 if(t0.vf<1)L("b",`<b>VRAM shortfall.</b> ${gname} has ${S.vram} GB, and High at this resolution wants about ${nd} GB. Expect texture pop-in and stutter. Drop textures to Medium.`);
 else L("g",`<b>VRAM is fine.</b> ${S.vram} GB covers High settings (about ${nd} GB needed).`);
 // RAM
 if(ram<12)L("b",`<b>RAM too low.</b> ${ram} GB will cause heavy stutter in an open world this big. 16 GB is the realistic minimum.`);
 else if(ram<16)L("w","<b>RAM is tight.</b> 12 GB works, but close background apps. 16 GB is recommended.");
 else if(ram<32)L("g",`<b>${ram} GB RAM is enough.</b> 32 GB gives extra headroom for background apps.`);
 else L("g",`<b>${ram} GB RAM is plenty.</b>`);
 if(S.sf<.95)L("w",`<b>Slow memory.</b> ${rt[0]} costs some FPS. Faster RAM helps most with 1% lows.`);
 // Storage
 if(st[0].startsWith("HDD"))L("b","<b>Hard drive detected.</b> Open-world streaming on an HDD means long loads and hitching. Move the game to an SSD.");
 else if(st[0].startsWith("SATA"))L("w","<b>SATA SSD works</b>, but an NVMe drive loads faster and streams more smoothly.");
 else L("g",`<b>${st[0]} is ideal</b> for fast loads and smooth world streaming.`);
 if(fr===1)L("w","<b>Disk space is tight.</b> Leave extra room for patches. Aim for 150 GB+ free.");
 else if(fr>=2)L("g","<b>Enough free space</b> for the install and patches.");
 // OS
 if(os===1&&$("os").selectedIndex===1)L("w","<b>Windows 10 is near end of support.</b> Windows 11 is the safer choice for new games.");
 if(os===2)L("w","<b>Linux:</b> expect Proton overhead (about 5 to 15% FPS) and possible anti-cheat or driver quirks.");
 if(os===3)L("b","<b>macOS isn’t a good target.</b> Emulation and Boot Camp results will be far below these estimates.");
 // PSU
 const need=Math.round((50+S.g*1.7+40+S.c*.5+100)/50)*50;
 if(psu>0){if(psu<need*.9)L("b",`<b>PSU risk.</b> This build wants roughly ${need} W and you have ${psu} W. Expect crashes under load.`);else if(psu<need)L("w",`<b>PSU is borderline.</b> Aim for about ${need} W.`);else L("g",`<b>PSU is fine</b> (build needs about ${need} W).`)}
 else L("w",`<b>Check your PSU.</b> This build wants roughly ${need} W.`);
 // Tips
 if(S.rt&&S.g<110)L("w","<b>Ray tracing is costly</b> on this GPU. Turning it off could add around 40% FPS.");
 if(!S.up&&top.fps<tg)L("w","<b>Turn on upscaling.</b> DLSS, FSR or XeSS can add roughly 30 to 40% FPS.");
